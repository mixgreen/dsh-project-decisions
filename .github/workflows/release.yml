name: GitHub Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Match tag and package version
        run: node scripts/release.mjs check --tag "$GITHUB_REF_NAME"
      - run: npm run release:pack
      - name: Publish immutable version assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file "dist/$GITHUB_REF_NAME/release-notes.md"
          "dist/$GITHUB_REF_NAME/"*.tgz "dist/$GITHUB_REF_NAME/SHA256SUMS"
